<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureMailScope | AI-Assisted Cryptographic Posture Assessment</title>
  <meta name="description" content="AI-Assisted Cryptographic Security Posture Assessment for Secure Email Communications" />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: "#32004B",
              orange: "#DD6E2D",
              cream: "#EDDEC2",
              black: "#17151A",
              dark: "#242126",
              muted: "#77727A",
              light: "#F5F3F1",
              border: "#E5DFD8",
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel for standalone instant execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F5F3F1;
      color: #17151A;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F5F3F1;
    }
    ::-webkit-scrollbar-thumb {
      background: #E5DFD8;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #77727A;
    }

    .enterprise-card {
      background: #FFFFFF;
      border: 1px solid #E5DFD8;
      border-radius: 10px;
      transition: all 0.15s ease-in-out;
    }
    .enterprise-card:hover {
      border-color: #D3CBC1;
    }
  </style>
</head>
<body class="bg-[#F5F3F1] text-[#17151A] overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper component for Lucide Icons
    function Icon({ name, size = 16, className = "", strokeWidth = 2 }) {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);

      return (
        <i
          data-lucide={name}
          className={`inline-block ${className}`}
          style={{ width: `${size}px`, height: `${size}px`, strokeWidth: strokeWidth }}
        />
      );
    }

    // Security Badge Component
    function SecurityBadge({ level, showIcon = true, size = 'sm' }) {
      const normalized = String(level).toUpperCase();

      const configs = {
        HIGH: { bg: 'bg-[#DD6E2D]/10', text: 'text-[#DD6E2D]', border: 'border-[#DD6E2D]/30', icon: 'shield-alert', label: 'HIGH' },
        CRITICAL: { bg: 'bg-[#b91c1c]/10', text: 'text-[#b91c1c]', border: 'border-[#b91c1c]/30', icon: 'shield-alert', label: 'CRITICAL' },
        MEDIUM: { bg: 'bg-[#EDDEC2]', text: 'text-[#844c12]', border: 'border-[#d8c3a1]', icon: 'alert-triangle', label: 'MEDIUM' },
        'MEDIUM RISK': { bg: 'bg-[#EDDEC2]', text: 'text-[#844c12]', border: 'border-[#d8c3a1]', icon: 'alert-triangle', label: 'MEDIUM RISK' },
        LOW: { bg: 'bg-[#F5F3F1]', text: 'text-[#77727A]', border: 'border-[#E5DFD8]', icon: 'info', label: 'LOW' },
        'LOW RISK': { bg: 'bg-[#e2f3e8]', text: 'text-[#1e6f40]', border: 'border-[#c1e6cd]', icon: 'shield-check', label: 'LOW RISK' },
        WARNING: { bg: 'bg-[#EDDEC2]', text: 'text-[#844c12]', border: 'border-[#d8c3a1]', icon: 'circle-alert', label: 'WARNING' },
        SECURE: { bg: 'bg-[#e7f7ed]', text: 'text-[#166534]', border: 'border-[#bbf0cb]', icon: 'shield-check', label: 'SECURE' },
        MODERN: { bg: 'bg-[#e7f7ed]', text: 'text-[#166534]', border: 'border-[#bbf0cb]', icon: 'shield-check', label: 'MODERN' },
        WEAK: { bg: 'bg-[#DD6E2D]/10', text: 'text-[#DD6E2D]', border: 'border-[#DD6E2D]/30', icon: 'shield-alert', label: 'WEAK' },
      };

      const c = configs[normalized] || { bg: 'bg-[#F5F3F1]', text: 'text-[#242126]', border: 'border-[#E5DFD8]', icon: 'info', label: normalized };
      const sizeClasses = size === 'xs' ? 'text-[10px] px-1.5 py-0.5 gap-1' : 'text-xs px-2 py-0.5 gap-1.5';

      return (
        <span className={`inline-flex items-center rounded-full border font-semibold ${c.bg} ${c.text} ${c.border} ${sizeClasses}`}>
          {showIcon && <Icon name={c.icon} size={size === 'xs' ? 11 : 13} />}
          <span>{c.label}</span>
        </span>
      );
    }

    // Button Component
    function Button({ children, variant = 'primary', size = 'md', icon, onClick, disabled = false, className = '' }) {
      const sizeStyles = {
        sm: 'text-xs px-2.5 py-1.5 gap-1.5',
        md: 'text-sm px-3.5 py-2 gap-2',
        lg: 'text-base px-4 py-2.5 gap-2.5'
      };

      const variantStyles = {
        primary: 'bg-[#DD6E2D] hover:bg-[#c55d22] active:bg-[#b0521c] text-white shadow-sm',
        brand: 'bg-[#32004B] hover:bg-[#250038] text-white shadow-sm',
        secondary: 'bg-[#EDDEC2] hover:bg-[#e4d2b2] text-[#32004B] font-semibold',
        outline: 'border border-[#E5DFD8] bg-white hover:bg-[#F5F3F1] text-[#242126]',
        ghost: 'text-[#77727A] hover:text-[#17151A] hover:bg-[#F5F3F1]'
      };

      return (
        <button
          disabled={disabled}
          onClick={onClick}
          className={`inline-flex items-center justify-center font-medium transition-all duration-150 rounded-[8px] focus:outline-none ${sizeStyles[size]} ${variantStyles[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'} ${className}`}
        >
          {icon && <Icon name={icon} size={size === 'sm' ? 14 : 16} />}
          <span>{children}</span>
        </button>
      );
    }

    // StatCard Component
    function StatCard({ title, value, status, subtitle, icon, badgeText, badgeType = 'default', highlight = false }) {
      return (
        <div className={`enterprise-card p-4 relative overflow-hidden ${highlight ? 'border-l-4 border-l-[#DD6E2D]' : ''}`}>
          <div className="flex items-start justify-between">
            <div className="space-y-1">
              <p className="text-xs font-semibold text-[#77727A] tracking-wider uppercase">{title}</p>
              <div className="flex items-baseline gap-2">
                <h3 className="text-2xl font-bold tracking-tight text-[#17151A] font-sans">{value}</h3>
                {status && <span className="text-xs font-medium text-[#77727A]">{status}</span>}
              </div>
            </div>
            {icon && (
              <div className="p-2 rounded-md bg-[#F5F3F1] text-[#32004B] border border-[#E5DFD8]">
                <Icon name={icon} size={18} />
              </div>
            )}
          </div>
          {(subtitle || badgeText) && (
            <div className="mt-2.5 pt-2.5 border-t border-[#E5DFD8]/60 flex items-center justify-between text-xs">
              {subtitle && <span className="text-[#77727A] truncate">{subtitle}</span>}
              {badgeText && (
                <span className={`px-1.5 py-0.5 rounded text-[11px] font-medium ${badgeType === 'warning' ? 'bg-[#EDDEC2] text-[#844c12]' : badgeType === 'danger' ? 'bg-[#DD6E2D]/15 text-[#DD6E2D]' : 'bg-[#F5F3F1] text-[#77727A]'}`}>
                  {badgeText}
                </span>
              )}
            </div>
          )}
        </div>
      );
    }

    // ChartCard Component
    function ChartCard({ title, subtitle, action, children, className = '' }) {
      return (
        <div className={`enterprise-card flex flex-col ${className}`}>
          <div className="px-5 py-4 border-b border-[#E5DFD8] flex items-center justify-between">
            <div>
              <h4 className="text-sm font-semibold text-[#17151A] tracking-tight">{title}</h4>
              {subtitle && <p className="text-xs text-[#77727A] mt-0.5">{subtitle}</p>}
            </div>
            {action && <div>{action}</div>}
          </div>
          <div className="flex-1 p-5">{children}</div>
        </div>
      );
    }

    // ProtocolCard Component
    function ProtocolCard({ protocol, status, connections, tlsVersion, cipherSuite, starttls, certificate, aiRisk, onInspect }) {
      const isCritical = status === 'CRITICAL';
      const isWarning = status === 'WARNING';

      return (
        <div className={`enterprise-card p-5 flex flex-col justify-between ${isCritical ? 'border-[#DD6E2D]/40' : isWarning ? 'border-[#d8c3a1]' : 'border-[#E5DFD8]'}`}>
          <div>
            <div className="flex items-center justify-between pb-4 border-b border-[#E5DFD8]">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-lg bg-[#32004B] text-[#EDDEC2] flex items-center justify-center font-bold text-sm tracking-wider shadow-sm">
                  <Icon name="mail" size={18} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className="text-lg font-bold text-[#17151A]">{protocol}</h3>
                    <span className="text-xs text-[#77727A] font-mono">{connections} conns</span>
                  </div>
                  <p className="text-xs text-[#77727A]">{protocol} Mail Telemetry</p>
                </div>
              </div>
              <SecurityBadge level={status} />
            </div>

            <div className="grid grid-cols-2 gap-2.5 py-4 text-xs">
              <div className="p-2.5 rounded-lg bg-[#F5F3F1] border border-[#E5DFD8]/60 space-y-1">
                <div className="flex items-center gap-1.5 text-[#77727A]">
                  <Icon name="lock" size={13} />
                  <span>TLS Version</span>
                </div>
                <div className="font-semibold text-[#17151A] font-mono flex items-center gap-1">
                  <span>{tlsVersion}</span>
                  {tlsVersion === 'TLS 1.0' && <span className="text-[9px] px-1 bg-[#DD6E2D]/15 text-[#DD6E2D] font-bold rounded">OBSOLETE</span>}
                </div>
              </div>

              <div className="p-2.5 rounded-lg bg-[#F5F3F1] border border-[#E5DFD8]/60 space-y-1">
                <div className="flex items-center gap-1.5 text-[#77727A]">
                  <Icon name="key" size={13} />
                  <span>Cipher Suite</span>
                </div>
                <div className={`font-semibold font-mono truncate ${cipherSuite.includes('Weak') ? 'text-[#DD6E2D]' : 'text-[#17151A]'}`} title={cipherSuite}>
                  {cipherSuite}
                </div>
              </div>

              <div className="p-2.5 rounded-lg bg-[#F5F3F1] border border-[#E5DFD8]/60 space-y-1">
                <div className="flex items-center gap-1.5 text-[#77727A]">
                  <Icon name="shield-check" size={13} />
                  <span>STARTTLS</span>
                </div>
                <div className={`font-semibold ${starttls === 'Misconfigured' ? 'text-[#DD6E2D]' : 'text-[#17151A]'}`}>
                  {starttls}
                </div>
              </div>

              <div className="p-2.5 rounded-lg bg-[#F5F3F1] border border-[#E5DFD8]/60 space-y-1">
                <div className="flex items-center gap-1.5 text-[#77727A]">
                  <Icon name="file-badge" size={13} />
                  <span>Certificate</span>
                </div>
                <div className={`font-semibold ${certificate.includes('Issue') ? 'text-[#DD6E2D]' : 'text-[#17151A]'}`}>
                  {certificate}
                </div>
              </div>
            </div>
          </div>

          <div className="pt-3 border-t border-[#E5DFD8] flex items-center justify-between text-xs">
            <div className="flex items-center gap-2">
              <span className="text-[#77727A]">AI Risk:</span>
              <span className={`font-bold ${aiRisk === 'High' ? 'text-[#DD6E2D]' : aiRisk === 'Medium' ? 'text-[#844c12]' : 'text-[#166534]'}`}>
                {aiRisk}
              </span>
            </div>
            {onInspect && (
              <button onClick={onInspect} className="font-semibold text-[#32004B] hover:text-[#DD6E2D] flex items-center gap-1">
                <span>Inspect</span>
                <Icon name="arrow-up-right" size={13} />
              </button>
            )}
          </div>
        </div>
      );
    }

    // Shared Findings Data
    const FINDINGS_DATA = [
      { id: 'FND-001', severity: 'HIGH', finding: 'Weak cipher suite', protocol: 'SMTP', evidence: 'TLS_RSA_WITH_3DES_EDE_CBC_SHA', status: 'Open', impact: '64-bit 3DES block cipher prone to SWEET32 collisions.', remediation: 'Deprecate 3DES in postfix/sendmail configuration.' },
      { id: 'FND-002', severity: 'MEDIUM', finding: 'TLS 1.0 detected', protocol: 'IMAP', evidence: 'TLSv1.0 handshake', status: 'Active', impact: 'RFC 8996 deprecated protocol vulnerable to downgrade attacks.', remediation: 'Set ssl_min_protocol = TLSv1.2 in mail daemon config.' },
      { id: 'FND-003', severity: 'MEDIUM', finding: 'Certificate issue', protocol: 'POP3', evidence: 'Certificate validation failure', status: 'Investigating', impact: 'POP3 certificate fails SAN match validation against host.', remediation: 'Renew certificate with complete SAN chain.' },
      { id: 'FND-004', severity: 'LOW', finding: 'STARTTLS misconfiguration', protocol: 'SMTP', evidence: 'STARTTLS negotiation inconsistency', status: 'In Review', impact: 'Opportunistic STARTTLS without strict MTA-STS policy enforcement.', remediation: 'Publish MTA-STS and DANE TLSA records.' },
      { id: 'FND-005', severity: 'LOW', finding: 'Weak key exchange', protocol: 'IMAP', evidence: 'Legacy DH parameters', status: 'Monitoring', impact: '1024-bit Diffie-Hellman parameter group size detected.', remediation: 'Upgrade DH parameters to 2048-bit or deploy ECDHE X25519.' }
    ];

    // Finding Table Component
    function FindingTable({ showFilters = true, initialLimit = null }) {
      const [search, setSearch] = useState('');
      const [filter, setFilter] = useState('ALL');
      const [selected, setSelected] = useState(null);

      const filtered = FINDINGS_DATA.filter(item => {
        const matchSearch = item.finding.toLowerCase().includes(search.toLowerCase()) || item.evidence.toLowerCase().includes(search.toLowerCase()) || item.protocol.toLowerCase().includes(search.toLowerCase());
        const matchFilter = filter === 'ALL' || item.severity === filter;
        return matchSearch && matchFilter;
      });

      const items = initialLimit ? filtered.slice(0, initialLimit) : filtered;

      return (
        <div className="w-full">
          {showFilters && (
            <div className="flex flex-col sm:flex-row items-center justify-between gap-3 mb-4">
              <div className="relative w-full sm:w-72">
                <Icon name="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#77727A]" />
                <input
                  type="text"
                  placeholder="Filter findings..."
                  value={search}
                  onChange={e => setSearch(e.target.value)}
                  className="w-full pl-9 pr-3 py-1.5 text-xs bg-white border border-[#E5DFD8] rounded-[8px] focus:outline-none focus:border-[#DD6E2D]"
                />
              </div>

              <div className="flex items-center gap-1 self-start sm:self-auto">
                {['ALL', 'HIGH', 'MEDIUM', 'LOW'].map(lvl => (
                  <button
                    key={lvl}
                    onClick={() => setFilter(lvl)}
                    className={`text-xs px-2.5 py-1 rounded-[6px] font-medium ${filter === lvl ? 'bg-[#32004B] text-white' : 'bg-white border border-[#E5DFD8] text-[#77727A]'}`}
                  >
                    {lvl}
                  </button>
                ))}
              </div>
            </div>
          )}

          <div className="enterprise-card overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-[#F5F3F1] border-b border-[#E5DFD8] text-[#77727A] uppercase font-semibold">
                    <th className="py-3 px-4 w-28">Severity</th>
                    <th className="py-3 px-4">Finding</th>
                    <th className="py-3 px-4 w-24">Protocol</th>
                    <th className="py-3 px-4">Evidence</th>
                    <th className="py-3 px-4 w-28">Status</th>
                    <th className="py-3 px-4 text-right w-16">Detail</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[#E5DFD8]">
                  {items.map(item => (
                    <tr key={item.id} onClick={() => setSelected(item)} className="hover:bg-[#F5F3F1]/70 cursor-pointer transition-colors group">
                      <td className="py-3 px-4"><SecurityBadge level={item.severity} /></td>
                      <td className="py-3 px-4 font-semibold text-[#17151A]">{item.finding}</td>
                      <td className="py-3 px-4 font-mono font-medium">{item.protocol}</td>
                      <td className="py-3 px-4 font-mono text-[#32004B] text-[11px] truncate max-w-[240px]">{item.evidence}</td>
                      <td className="py-3 px-4">
                        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-[#F5F3F1] text-[#242126] border border-[#E5DFD8]">
                          <span className="w-1.5 h-1.5 rounded-full bg-[#DD6E2D]" />
                          {item.status}
                        </span>
                      </td>
                      <td className="py-3 px-4 text-right"><Icon name="chevron-right" size={15} className="text-[#77727A] group-hover:text-[#DD6E2D]" /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {selected && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
              <div className="bg-white rounded-[12px] border border-[#E5DFD8] shadow-xl w-full max-w-xl overflow-hidden">
                <div className="px-6 py-4 bg-[#32004B] text-white flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="shield-alert" size={18} className="text-[#DD6E2D]" />
                    <h3 className="text-sm font-semibold">{selected.finding} ({selected.id})</h3>
                  </div>
                  <button onClick={() => setSelected(null)} className="text-[#EDDEC2] hover:text-white"><Icon name="x" size={18} /></button>
                </div>
                <div className="p-6 space-y-3 text-xs">
                  <div className="flex gap-2 items-center">
                    <SecurityBadge level={selected.severity} />
                    <span className="font-mono text-[#77727A]">Protocol: {selected.protocol}</span>
                  </div>
                  <div>
                    <span className="font-semibold text-[#77727A] block">Captured Packet Cryptographic Evidence:</span>
                    <div className="p-2.5 bg-[#17151A] text-[#EDDEC2] font-mono text-xs rounded mt-1">{selected.evidence}</div>
                  </div>
                  <div>
                    <span className="font-semibold text-[#77727A] block">Impact:</span>
                    <p className="text-[#242126] bg-[#F5F3F1] p-2.5 rounded mt-1">{selected.impact}</p>
                  </div>
                  <div>
                    <span className="font-semibold text-[#77727A] block">Remediation Action:</span>
                    <p className="text-[#32004B] bg-[#EDDEC2]/40 border border-[#EDDEC2] p-2.5 rounded mt-1 font-medium">{selected.remediation}</p>
                  </div>
                </div>
                <div className="px-6 py-3 bg-[#F5F3F1] border-t border-[#E5DFD8] flex justify-end">
                  <Button variant="brand" size="sm" onClick={() => setSelected(null)}>Close</Button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- SCREEN 1: DASHBOARD ---
    function ScreenDashboard({ onNavigate }) {
      return (
        <div className="space-y-6">
          <div className="bg-[#EDDEC2] border border-[#d8c3a1] rounded-[10px] p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-start gap-3">
              <div className="p-2 rounded-lg bg-[#32004B] text-[#EDDEC2] mt-0.5"><Icon name="activity" size={18} /></div>
              <div>
                <div className="flex items-center gap-2">
                  <h2 className="text-sm font-bold text-[#32004B]">Active Assessment: secure_email.pcap</h2>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#DD6E2D] text-white font-mono font-semibold">MEDIUM RISK</span>
                </div>
                <p className="text-xs text-[#242126] mt-0.5">1,284 packets inspected across 46 TLS handshakes. Deprecated 3DES and TLS 1.0 negotiations flagged.</p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <Button variant="outline" size="sm" onClick={() => onNavigate('explainability')}>Explain Score (SHAP)</Button>
              <Button variant="primary" size="sm" icon="arrow-right" onClick={() => onNavigate('pcap')}>New Capture</Button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <StatCard title="Overall Security Score" value="72 / 100" status="MEDIUM RISK" subtitle="Cryptographic ML" icon="shield-check" badgeText="Medium Risk" badgeType="warning" highlight={true} />
            <StatCard title="TLS Coverage" value="94%" status="Encrypted" subtitle="43 of 46 Sessions" icon="lock" badgeText="Target > 90%" />
            <StatCard title="Weak Ciphers" value="3" status="Flagged" subtitle="3DES & CBC-mode" icon="key" badgeText="Action Req." badgeType="danger" />
            <StatCard title="Certificate Issues" value="1" status="Warning" subtitle="POP3 Validation Mismatch" icon="file-badge" badgeText="Audit Req." badgeType="warning" />
            <StatCard title="Network Connections" value="46" status="Inspected" subtitle="SMTP:21 | IMAP:17 | POP3:8" icon="network" badgeText="Stream Ready" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <div className="lg:col-span-4">
              <ChartCard title="Security Score Visualizer" subtitle="Score 72/100 based on cipher & protocol audit">
                <div className="flex flex-col items-center justify-center py-2">
                  <div className="relative w-44 h-32 flex items-center justify-center">
                    <svg className="w-44 h-44 -rotate-90" viewBox="0 0 100 100">
                      <circle cx="50" cy="50" r="40" fill="transparent" stroke="#E5DFD8" strokeWidth="10" strokeDasharray="251.2" strokeDashoffset="125.6" strokeLinecap="round" />
                      <circle cx="50" cy="50" r="40" fill="transparent" stroke="#DD6E2D" strokeWidth="10" strokeDasharray="251.2" strokeDashoffset={125.6 + (125.6 * (1 - 0.72))} strokeLinecap="round" />
                    </svg>
                    <div className="absolute top-8 flex flex-col items-center">
                      <span className="text-3xl font-extrabold text-[#17151A]">72</span>
                      <span className="text-[10px] font-semibold text-[#77727A] uppercase">Score / 100</span>
                    </div>
                  </div>
                  <div className="mt-1 flex items-center gap-2">

  </script>
